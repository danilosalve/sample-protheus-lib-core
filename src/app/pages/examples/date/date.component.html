@if (isInsideProtheus) {
  <form>
    <po-select
      p-label="Idioma"
      [p-options]="options"
      name="table"
      p-placeholder="Selecione um idioma"
      (p-change)="getDateFormat($event)"
    />
  </form>

  @if (isLoading) {
    <po-loading-overlay />
  } @else {
    @if (dateFormat) {
      <po-container>
        {{ dateFormat }}
      </po-container>
    } @else {
      <p class="po-font-text">Não há dados</p>
    }
  }
} @else {
  <po-container>
    <p class="po-font-text">
      Ops, para utilizar o serviço ProDate é necessario utilizar o aplicativo dentro do Protheus. Para prosseguir, abra
      o aplicativo pelo Protheus.
    </p>
  </po-container>
}
