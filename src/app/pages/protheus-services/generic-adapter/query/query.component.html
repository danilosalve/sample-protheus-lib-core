<po-page-default
  p-title="ProGenericAdapter:Query"
  p-subtitle="Método para devolver uma listagem de registro baseado na api genericQuery"
  [p-breadcrumb]="breadCrumb"
>
  <po-table
    [p-items]="items"
    [p-loading]="isLoading"
    [p-draggable]="true"
    [p-columns]="columns"
    (p-show-more)="onShowMore()"
    [p-show-more-disabled]="isDisableShowMore"
    p-container="shadow"
    [p-striped]="true"
    [p-hide-table-search]="false"
  />
</po-page-default>
